name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate content
        run: npm run content
      - run: npm run typecheck
      - run: npm test
      - name: Build both apps
        run: npx vite build && npx vite build --mode lesefutter
