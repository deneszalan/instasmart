<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" font-family="system-ui, sans-serif">
  <text x="540" y="100" fill="#fff" font-size="54" font-weight="800" text-anchor="middle">Say the ink colour, not the word</text>
  <text x="290" y="230" fill="#fff" fill-opacity="0.8" font-size="38" font-weight="600" text-anchor="middle">Matching</text>
  <text x="790" y="230" fill="#fff" fill-opacity="0.8" font-size="38" font-weight="600" text-anchor="middle">Clashing</text>
  <line x1="540" y1="200" x2="540" y2="860" stroke="#fff" stroke-opacity="0.35" stroke-width="4"/>
  <g font-size="72" font-weight="800" text-anchor="middle">
    <text x="290" y="370" fill="#fb7185">RED</text>
    <text x="290" y="510" fill="#86efac">GREEN</text>
    <text x="290" y="650" fill="#7dd3fc">BLUE</text>
    <text x="290" y="790" fill="#fde047">YELLOW</text>
    <text x="790" y="370" fill="#86efac">RED</text>
    <text x="790" y="510" fill="#7dd3fc">GREEN</text>
    <text x="790" y="650" fill="#fde047">BLUE</text>
    <text x="790" y="790" fill="#fb7185">YELLOW</text>
  </g>
  <text x="540" y="960" fill="#fff" fill-opacity="0.85" font-size="36" text-anchor="middle">The clashing column takes longer to name</text>
</svg>
