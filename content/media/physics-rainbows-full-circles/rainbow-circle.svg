<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" role="img" aria-labelledby="title desc">
  <title id="title">A rainbow is part of a circle</title>
  <desc id="desc">A rainbow circle centered opposite the Sun. Its bright upper half appears above the horizon; its lower half is faded to show the part usually hidden from the ground. Schematic for the Sun near the horizon.</desc>
  <rect x="30" y="30" width="1020" height="1020" rx="48" fill="#172449"/>
  <g font-family="system-ui, sans-serif" text-anchor="middle" fill="#ffffff">
    <text x="540" y="120" font-size="60" font-weight="700">A circle seen in part</text>
    <text x="540" y="200" font-size="48">Visible arc</text>
    <g fill="none" stroke-width="12" opacity="0.25">
      <circle cx="540" cy="585" r="340" stroke="#ffa0a0"/>
      <circle cx="540" cy="585" r="325" stroke="#ffc58c"/>
      <circle cx="540" cy="585" r="310" stroke="#ffe494"/>
      <circle cx="540" cy="585" r="295" stroke="#9de4b8"/>
      <circle cx="540" cy="585" r="280" stroke="#9dcfff"/>
      <circle cx="540" cy="585" r="265" stroke="#b0baff"/>
      <circle cx="540" cy="585" r="250" stroke="#dab3ff"/>
    </g>
    <g fill="none" stroke-width="12">
      <path d="M200 585 A340 340 0 0 1 880 585" stroke="#ffa0a0"/>
      <path d="M215 585 A325 325 0 0 1 865 585" stroke="#ffc58c"/>
      <path d="M230 585 A310 310 0 0 1 850 585" stroke="#ffe494"/>
      <path d="M245 585 A295 295 0 0 1 835 585" stroke="#9de4b8"/>
      <path d="M260 585 A280 280 0 0 1 820 585" stroke="#9dcfff"/>
      <path d="M275 585 A265 265 0 0 1 805 585" stroke="#b0baff"/>
      <path d="M290 585 A250 250 0 0 1 790 585" stroke="#dab3ff"/>
    </g>
    <path d="M80 585 H1000" stroke="#ffffff" stroke-width="6" stroke-dasharray="16 14"/>
    <circle cx="540" cy="585" r="12" fill="#ffffff"/>
    <text x="540" y="500" font-size="48">Opposite the Sun</text>
    <text x="540" y="675" font-size="48">Horizon</text>
    <text x="540" y="760" font-size="48" fill="#d4daef">Usually hidden</text>
    <text x="540" y="1010" font-size="40" fill="#d4daef">Schematic · Sun near the horizon</text>
  </g>
</svg>
