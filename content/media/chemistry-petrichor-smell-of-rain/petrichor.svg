<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" font-family="system-ui, sans-serif">
  <text x="540" y="100" fill="#fff" font-size="58" font-weight="800" text-anchor="middle">How the smell gets airborne</text>
  <text x="540" y="160" fill="#fff" fill-opacity="0.85" font-size="34" text-anchor="middle">Geosmin and plant oils ride tiny droplets up to your nose</text>
  <rect x="60" y="740" width="960" height="280" rx="18" fill="#fff" fill-opacity="0.16"/>
  <g fill="#fff" fill-opacity="0.5">
    <circle cx="140" cy="800" r="7"/><circle cx="300" cy="860" r="7"/><circle cx="220" cy="890" r="6"/>
    <circle cx="760" cy="810" r="7"/><circle cx="880" cy="870" r="6"/><circle cx="960" cy="790" r="7"/>
  </g>
  <path d="M180,850 q20,-30 40,0 t40,0 t40,0" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
  <path d="M780,860 q20,-30 40,0 t40,0 t40,0" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
  <text x="540" y="940" fill="#fff" font-size="34" font-weight="700" text-anchor="middle">Dry soil: Streptomyces bacteria make geosmin,</text>
  <text x="540" y="985" fill="#fff" font-size="34" font-weight="700" text-anchor="middle">and plants shed oils that collect on the ground</text>
  <text x="540" y="250" fill="#fff" font-size="38" font-weight="700" text-anchor="middle">Raindrop lands</text>
  <path d="M540,290 C590,360 610,400 610,435 A70,70 0 1 1 470,435 C470,400 490,360 540,290 Z" fill="#fff" fill-opacity="0.9"/>
  <line x1="540" y1="540" x2="540" y2="700" stroke="#fff" stroke-width="8" stroke-linecap="round"/>
  <path d="M510,668 L540,706 L570,668" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M470,742 q70,-60 140,0" fill="none" stroke="#fff" stroke-width="6" stroke-dasharray="3 12" stroke-linecap="round"/>
  <g fill="none" stroke="#fff" stroke-width="5">
    <circle cx="420" cy="660" r="12"/><circle cx="360" cy="580" r="16"/><circle cx="300" cy="490" r="20"/><circle cx="250" cy="390" r="24"/>
    <circle cx="660" cy="660" r="12"/><circle cx="720" cy="580" r="16"/><circle cx="780" cy="490" r="20"/><circle cx="830" cy="390" r="24"/>
  </g>
  <text x="230" y="700" fill="#fff" font-size="36" font-weight="700" text-anchor="middle">Air bubbles burst</text>
  <text x="850" y="700" fill="#fff" font-size="36" font-weight="700" text-anchor="middle">Scent droplets rise</text>
</svg>
