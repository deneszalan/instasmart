<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" font-family="system-ui, sans-serif">
  <text x="540" y="80" fill="#fff" font-size="54" font-weight="800" text-anchor="middle">Three ways to write a word</text>
  <text x="60" y="250" fill="#fff" font-size="44" font-weight="800">Alphabet</text>
  <text x="60" y="300" fill="#fff" fill-opacity="0.85" font-size="34">one sign per sound</text>
  <g fill="#fff" fill-opacity="0.92">
    <rect x="620" y="200" width="110" height="110" rx="14"/>
    <rect x="750" y="200" width="110" height="110" rx="14"/>
    <rect x="880" y="200" width="110" height="110" rx="14"/>
  </g>
  <g fill="#5a2d0c" font-size="48" font-weight="800" text-anchor="middle">
    <text x="675" y="272">c</text><text x="805" y="272">a</text><text x="935" y="272">t</text>
  </g>
  <text x="805" y="360" fill="#fff" fill-opacity="0.85" font-size="34" text-anchor="middle">26 letters in English</text>
  <text x="60" y="540" fill="#fff" font-size="44" font-weight="800">Syllabary</text>
  <text x="60" y="590" fill="#fff" fill-opacity="0.85" font-size="34">one sign per syllable</text>
  <g fill="#fff" fill-opacity="0.92">
    <rect x="620" y="490" width="110" height="110" rx="14"/>
    <rect x="750" y="490" width="110" height="110" rx="14"/>
    <rect x="880" y="490" width="110" height="110" rx="14"/>
  </g>
  <g fill="#5a2d0c" font-size="40" font-weight="800" text-anchor="middle">
    <text x="675" y="559">tsa</text><text x="805" y="559">la</text><text x="935" y="559">gi</text>
  </g>
  <text x="805" y="650" fill="#fff" fill-opacity="0.85" font-size="34" text-anchor="middle">85 symbols in Cherokee</text>
  <text x="60" y="830" fill="#fff" font-size="44" font-weight="800">Logographic</text>
  <text x="60" y="880" fill="#fff" fill-opacity="0.85" font-size="34">one sign per word</text>
  <rect x="700" y="780" width="210" height="110" rx="14" fill="#fff" fill-opacity="0.92"/>
  <text x="805" y="849" fill="#5a2d0c" font-size="40" font-weight="800" text-anchor="middle">a word</text>
  <text x="805" y="940" fill="#fff" fill-opacity="0.85" font-size="34" text-anchor="middle">thousands of characters</text>
</svg>
