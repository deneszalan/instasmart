<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" font-family="system-ui, sans-serif">
  <text x="540" y="92" fill="#fff" font-size="56" font-weight="800" text-anchor="middle">A shortcut that slows everyone</text>
  <text x="540" y="150" fill="#fff" fill-opacity="0.85" font-size="34" text-anchor="middle">4,000 drivers travel from Start to End</text>
  <g stroke="#fff" stroke-width="8" stroke-linecap="round">
    <line x1="160" y1="538" x2="500" y2="352"/>
    <line x1="580" y1="352" x2="920" y2="538"/>
    <line x1="160" y1="582" x2="500" y2="768"/>
    <line x1="580" y1="768" x2="920" y2="582"/>
  </g>
  <line x1="540" y1="378" x2="540" y2="742" stroke="#fde047" stroke-width="10" stroke-dasharray="18 16" stroke-linecap="round"/>
  <g fill="#fff" fill-opacity="0.15" stroke="#fff" stroke-width="6">
    <circle cx="120" cy="560" r="46"/>
    <circle cx="540" cy="330" r="46"/>
    <circle cx="540" cy="790" r="46"/>
    <circle cx="960" cy="560" r="46"/>
  </g>
  <g fill="#fff" font-size="30" font-weight="800" text-anchor="middle">
    <text x="120" y="571">Start</text>
    <text x="540" y="342">A</text>
    <text x="540" y="802">B</text>
    <text x="960" y="571">End</text>
  </g>
  <g fill="#fff" font-size="34" font-weight="700" text-anchor="middle">
    <text x="290" y="395">T/100 min</text>
    <text x="790" y="400">45 min</text>
    <text x="290" y="745">45 min</text>
    <text x="800" y="755">T/100 min</text>
  </g>
  <text x="600" y="572" fill="#fde047" font-size="34" font-weight="700">new road: 0 min</text>
  <text x="540" y="900" fill="#fff" fill-opacity="0.8" font-size="30" text-anchor="middle">T/100: minutes that grow with the number of cars T</text>
  <text x="540" y="975" fill="#fff" font-size="40" font-weight="800" text-anchor="middle">Without the new road: 65 min each</text>
  <text x="540" y="1035" fill="#fde047" font-size="40" font-weight="800" text-anchor="middle">With it: 80 min each</text>
</svg>
