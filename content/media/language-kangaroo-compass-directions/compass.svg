<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" font-family="system-ui, sans-serif">
  <text x="540" y="80" fill="#fff" font-size="54" font-weight="800" text-anchor="middle">Where is the cup?</text>
  <circle cx="900" cy="250" r="70" fill="none" stroke="#fff" stroke-width="6"/>
  <polygon points="900,190 915,250 900,240 885,250" fill="#fff"/>
  <text x="900" y="160" fill="#fff" font-size="36" font-weight="800" text-anchor="middle">N</text>
  <text x="900" y="358" fill="#fff" font-size="36" font-weight="800" text-anchor="middle">S</text>
  <text x="998" y="263" fill="#fff" font-size="36" font-weight="800" text-anchor="middle">E</text>
  <text x="802" y="263" fill="#fff" font-size="36" font-weight="800" text-anchor="middle">W</text>
  <rect x="300" y="450" width="480" height="340" rx="24" fill="#fff" fill-opacity="0.16" stroke="#fff" stroke-width="6"/>
  <circle cx="540" cy="680" r="70" fill="none" stroke="#fff" stroke-width="8"/>
  <circle cx="540" cy="680" r="42" fill="none" stroke="#fff" stroke-opacity="0.6" stroke-width="4"/>
  <text x="630" y="692" fill="#fff" fill-opacity="0.85" font-size="30">plate</text>
  <circle cx="540" cy="520" r="40" fill="#fff" fill-opacity="0.92"/>
  <path d="M580,505 q40,15 0,40" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round"/>
  <text x="480" y="532" fill="#fff" fill-opacity="0.85" font-size="30" text-anchor="end">cup</text>
  <circle cx="200" cy="620" r="44" fill="#fff" fill-opacity="0.92"/>
  <path d="M130,760 Q200,690 270,760" fill="#fff" fill-opacity="0.92"/>
  <path d="M250,620 L290,620" stroke="#fff" stroke-width="8" stroke-linecap="round"/>
  <path d="M275,604 L293,620 L275,636" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="200" y="830" fill="#fff" fill-opacity="0.85" font-size="30" text-anchor="middle">facing east</text>
  <text x="60" y="960" fill="#fff" font-size="34" font-weight="700">English:</text>
  <text x="60" y="1005" fill="#fff" fill-opacity="0.9" font-size="32">‘the cup is on your left’</text>
  <text x="1020" y="960" fill="#fff" font-size="34" font-weight="700" text-anchor="end">Guugu Yimithirr:</text>
  <text x="1020" y="1005" fill="#fff" fill-opacity="0.9" font-size="32" text-anchor="end">‘the cup is north of the plate’</text>
</svg>
