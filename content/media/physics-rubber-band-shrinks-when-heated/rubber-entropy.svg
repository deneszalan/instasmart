<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#fff"/>
    </marker>
  </defs>
  <text x="540" y="90" fill="#fff" font-size="56" font-weight="800" text-anchor="middle">Why rubber pulls back</text>
  <rect x="70" y="330" width="390" height="260" rx="40" fill="#fff" fill-opacity="0.15" stroke="#fff" stroke-width="8"/>
  <g fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round">
    <path d="M110,400 c30,-60 60,60 90,0 s60,-70 90,0 s60,60 90,0 s30,-40 50,-10"/>
    <path d="M120,470 c40,-80 50,90 100,10 s40,-90 90,0 s60,80 110,0"/>
    <path d="M110,540 c30,-50 70,60 100,0 s50,-60 90,0 s50,50 90,0 s30,-40 40,-10"/>
  </g>
  <text x="265" y="655" fill="#fff" font-size="36" font-weight="700" text-anchor="middle">Relaxed: chains tangled</text>
  <text x="265" y="700" fill="#fff" font-size="34" text-anchor="middle">many arrangements</text>
  <rect x="560" y="400" width="460" height="120" rx="30" fill="#fff" fill-opacity="0.15" stroke="#fff" stroke-width="8"/>
  <g fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round">
    <path d="M590,432 q100,-12 200,0 t200,0"/>
    <path d="M590,460 q100,10 200,0 t200,0"/>
    <path d="M590,488 q100,-10 200,0 t200,0"/>
  </g>
  <text x="790" y="655" fill="#fff" font-size="36" font-weight="700" text-anchor="middle">Stretched: chains straight</text>
  <text x="790" y="700" fill="#fff" font-size="34" text-anchor="middle">few arrangements</text>
  <line x1="470" y1="440" x2="545" y2="440" stroke="#fff" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line x1="548" y1="500" x2="473" y2="500" stroke="#fff" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="508" y="418" fill="#fff" font-size="34" font-weight="700" text-anchor="middle">pull</text>
  <text x="508" y="555" fill="#fff" font-size="34" font-weight="700" text-anchor="middle">heat</text>
  <text x="540" y="830" fill="#fff" font-size="34" text-anchor="middle">Heat jostles the chains harder.</text>
  <text x="540" y="880" fill="#fff" font-size="34" text-anchor="middle">Tangled has far more ways than straight,</text>
  <text x="540" y="930" fill="#fff" font-size="34" text-anchor="middle">so a warm band pulls itself shorter.</text>
</svg>
