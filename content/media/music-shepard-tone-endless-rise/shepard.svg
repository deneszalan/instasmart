<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" font-family="system-ui, sans-serif">
  <defs>
    <linearGradient id="fade" gradientUnits="userSpaceOnUse" x1="0" y1="220" x2="0" y2="840">
      <stop offset="0" stop-color="#fff" stop-opacity="0.05"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.05"/>
    </linearGradient>
  </defs>
  <text x="540" y="92" fill="#fff" font-size="56" font-weight="800" text-anchor="middle">The endless climb</text>
  <text x="540" y="150" fill="#fff" fill-opacity="0.85" font-size="34" text-anchor="middle">Pitch rising over time, in six octave-spaced copies</text>
  <g stroke="#fff" stroke-opacity="0.6" stroke-width="6" stroke-linecap="round">
    <line x1="140" y1="200" x2="140" y2="860"/>
    <line x1="120" y1="840" x2="1000" y2="840"/>
  </g>
  <text x="160" y="250" fill="#fff" fill-opacity="0.85" font-size="32" font-weight="700">fades out at the top</text>
  <g stroke="url(#fade)" stroke-width="14" stroke-linecap="round">
    <line x1="140" y1="663" x2="440" y2="220"/>
    <line x1="190" y1="840" x2="610" y2="220"/>
    <line x1="360" y1="840" x2="780" y2="220"/>
    <line x1="530" y1="840" x2="950" y2="220"/>
    <line x1="700" y1="840" x2="980" y2="427"/>
    <line x1="870" y1="840" x2="980" y2="678"/>
  </g>
  <text x="540" y="905" fill="#fff" font-size="34" font-weight="700" text-anchor="middle">Each copy fades in low and fades out high,</text>
  <text x="540" y="952" fill="#fff" font-size="34" font-weight="700" text-anchor="middle">so your ear follows the loud middle for ever</text>
  <text x="540" y="1025" fill="#fff" fill-opacity="0.75" font-size="30" text-anchor="middle">Up the page: higher pitch. Across: time.</text>
</svg>
