<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" font-family="system-ui, sans-serif">
  <text x="540" y="110" fill="#fff" font-size="58" font-weight="800" text-anchor="middle">One day on Mercury</text>
  <line x1="150" y1="250" x2="150" y2="880" stroke="#fff" stroke-opacity="0.5" stroke-width="4"/>
  <g fill="#fff" font-size="40" font-weight="700">
    <text x="150" y="300">One spin</text>
    <rect x="150" y="322" width="253" height="52" rx="6" fill="#fff" fill-opacity="0.9"/>
    <text x="425" y="360" font-size="38" font-weight="600">59 Earth days</text>
    <text x="150" y="500">One year</text>
    <rect x="150" y="522" width="380" height="52" rx="6" fill="#fff" fill-opacity="0.9"/>
    <text x="552" y="560" font-size="38" font-weight="600">88 Earth days</text>
    <text x="150" y="700">Sunrise to sunrise</text>
    <rect x="150" y="722" width="760" height="52" rx="6" fill="#fff" fill-opacity="0.9"/>
    <text x="150" y="836" font-size="38" font-weight="600">176 Earth days, or two Mercury years</text>
  </g>
  <text x="540" y="1000" fill="#fff" fill-opacity="0.8" font-size="34" text-anchor="middle">Bars to scale. Three spins for every two orbits.</text>
</svg>
