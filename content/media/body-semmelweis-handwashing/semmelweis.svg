<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" font-family="system-ui, sans-serif">
  <text x="540" y="90" fill="#fff" font-size="52" font-weight="800" text-anchor="middle">Deaths of mothers, First Clinic</text>
  <text x="540" y="145" fill="#fff" fill-opacity="0.85" font-size="36" text-anchor="middle">Vienna General Hospital, 1847</text>
  <line x1="80" y1="860" x2="1020" y2="860" stroke="#fff" stroke-opacity="0.6" stroke-width="4"/>
  <g fill="#fff" fill-opacity="0.9">
    <rect x="110" y="300" width="150" height="560" rx="6"/>
    <rect x="430" y="793" width="150" height="67" rx="6"/>
    <rect x="640" y="823" width="150" height="37" rx="6"/>
    <rect x="850" y="802" width="150" height="58" rx="6"/>
  </g>
  <g fill="#fff" font-size="40" font-weight="800" text-anchor="middle">
    <text x="185" y="270">18.3%</text>
    <text x="505" y="765">2.2%</text>
    <text x="715" y="795">1.2%</text>
    <text x="925" y="774">1.9%</text>
  </g>
  <g fill="#fff" fill-opacity="0.9" font-size="36" font-weight="600" text-anchor="middle">
    <text x="185" y="915">April</text>
    <text x="505" y="915">June</text>
    <text x="715" y="915">July</text>
    <text x="925" y="915">August</text>
  </g>
  <line x1="345" y1="330" x2="345" y2="880" stroke="#fde047" stroke-width="6" stroke-dasharray="14 14" stroke-linecap="round"/>
  <text x="365" y="400" fill="#fde047" font-size="34" font-weight="700">Mid-May: hand-washing</text>
  <text x="365" y="445" fill="#fde047" font-size="34" font-weight="700">in chlorinated lime begins</text>
</svg>
