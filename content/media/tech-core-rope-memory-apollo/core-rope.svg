<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" font-family="system-ui, sans-serif">
  <text x="540" y="96" fill="#fff" font-size="56" font-weight="800" text-anchor="middle">Data in the weaving</text>
  <text x="540" y="154" fill="#fff" fill-opacity="0.85" font-size="34" text-anchor="middle">A sense wire either threads a magnetic core or skips it</text>
  <circle cx="320" cy="560" r="150" fill="none" stroke="#fff" stroke-opacity="0.4" stroke-width="46"/>
  <circle cx="760" cy="560" r="150" fill="none" stroke="#fff" stroke-opacity="0.4" stroke-width="46"/>
  <path d="M50,560 L500,560 C560,560 560,330 640,330 L880,330 C960,330 960,560 1030,560" fill="none" stroke="#fde047" stroke-width="12" stroke-linecap="round"/>
  <text x="320" y="810" fill="#fff" font-size="84" font-weight="800" text-anchor="middle">1</text>
  <text x="760" y="810" fill="#fff" font-size="84" font-weight="800" text-anchor="middle">0</text>
  <text x="320" y="872" fill="#fff" font-size="36" font-weight="700" text-anchor="middle">Wire goes through</text>
  <text x="760" y="872" fill="#fff" font-size="36" font-weight="700" text-anchor="middle">Wire goes around</text>
  <text x="540" y="980" fill="#fff" fill-opacity="0.85" font-size="34" text-anchor="middle">192 wires threaded each Apollo core,</text>
  <text x="540" y="1026" fill="#fff" fill-opacity="0.85" font-size="34" text-anchor="middle">storing twelve 16-bit words per core</text>
</svg>
