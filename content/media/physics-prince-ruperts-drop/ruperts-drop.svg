<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#fff"/>
    </marker>
  </defs>
  <text x="540" y="90" fill="#fff" font-size="56" font-weight="800" text-anchor="middle">Inside a Prince Rupert’s drop</text>
  <path d="M560,470 C720,420 880,400 1020,380 C880,440 720,480 575,565 Z" fill="#fff" fill-opacity="0.85"/>
  <circle cx="400" cy="560" r="190" fill="#fff" fill-opacity="0.2" stroke="#fff" stroke-width="8"/>
  <circle cx="400" cy="560" r="170" fill="none" stroke="#fff" stroke-width="40" stroke-opacity="0.5"/>
  <circle cx="400" cy="560" r="150" fill="none" stroke="#fff" stroke-width="4" stroke-dasharray="14 10"/>
  <g stroke="#fff" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow)">
    <line x1="400" y1="300" x2="400" y2="362"/>
    <line x1="400" y1="820" x2="400" y2="758"/>
    <line x1="140" y1="560" x2="202" y2="560"/>
  </g>
  <g stroke="#fff" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow)">
    <line x1="400" y1="560" x2="400" y2="470"/>
    <line x1="400" y1="560" x2="400" y2="650"/>
    <line x1="400" y1="560" x2="310" y2="560"/>
    <line x1="400" y1="560" x2="490" y2="560"/>
  </g>
  <text x="400" y="255" fill="#fff" font-size="36" font-weight="700" text-anchor="middle">Skin: squeezed, up to 700 MPa</text>
  <line x1="235" y1="722" x2="330" y2="650" stroke="#fff" stroke-width="4"/>
  <text x="60" y="770" fill="#fff" font-size="34" font-weight="700" text-anchor="start">Core: stretched</text>
  <text x="800" y="330" fill="#fff" font-size="36" font-weight="700" text-anchor="middle">Thin tail: a crack’s way in</text>
  <text x="540" y="890" fill="#fff" font-size="34" text-anchor="middle">Cracks can’t cross the squeezed skin.</text>
  <text x="540" y="940" fill="#fff" font-size="34" text-anchor="middle">Break the tail and the stretched core</text>
  <text x="540" y="990" fill="#fff" font-size="34" text-anchor="middle">lets go at 1,450–1,900 m/s.</text>
</svg>
