<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#fff"/>
    </marker>
  </defs>
  <text x="540" y="90" fill="#fff" font-size="52" font-weight="800" text-anchor="middle">Carbon dioxide: no liquid at 1 atm</text>
  <line x1="180" y1="880" x2="1000" y2="880" stroke="#fff" stroke-width="6" marker-end="url(#arrow)"/>
  <line x1="180" y1="880" x2="180" y2="180" stroke="#fff" stroke-width="6" marker-end="url(#arrow)"/>
  <text x="590" y="945" fill="#fff" font-size="34" text-anchor="middle">temperature</text>
  <text x="180" y="150" fill="#fff" font-size="34" text-anchor="middle">pressure</text>
  <g fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round">
    <path d="M250,860 Q470,780 560,600"/>
    <path d="M560,600 L600,190"/>
    <path d="M560,600 Q740,520 900,330"/>
  </g>
  <text x="330" y="430" fill="#fff" font-size="42" font-weight="800" text-anchor="middle">Solid</text>
  <text x="730" y="370" fill="#fff" font-size="42" font-weight="800" text-anchor="middle">Liquid</text>
  <text x="860" y="745" fill="#fff" font-size="42" font-weight="800" text-anchor="middle">Gas</text>
  <circle cx="560" cy="600" r="11" fill="#fff"/>
  <text x="590" y="640" fill="#fff" font-size="34" font-weight="700" text-anchor="start">triple point</text>
  <text x="590" y="680" fill="#fff" font-size="34" text-anchor="start">5.1 atm, −56.4 °C</text>
  <line x1="180" y1="800" x2="1000" y2="800" stroke="#fff" stroke-width="4" stroke-dasharray="12 12"/>
  <text x="990" y="790" fill="#fff" font-size="34" text-anchor="end">1 atm (normal air)</text>
  <circle cx="374" cy="800" r="11" fill="#fff"/>
  <text x="400" y="848" fill="#fff" font-size="34" font-weight="700" text-anchor="start">−78.5 °C: solid turns to gas</text>
</svg>
