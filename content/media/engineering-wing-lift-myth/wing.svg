<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" font-family="system-ui, sans-serif">
  <text x="540" y="92" fill="#fff" font-size="56" font-weight="800" text-anchor="middle">How a wing really lifts</text>
  <text x="540" y="150" fill="#fff" fill-opacity="0.85" font-size="34" text-anchor="middle">Two parcels of air that part at the nose never meet again</text>
  <path d="M60,470 C180,470 240,380 440,380 C620,380 760,500 1000,560" fill="none" stroke="#fff" stroke-opacity="0.7" stroke-width="8" stroke-linecap="round"/>
  <path d="M60,620 C200,620 300,640 460,640 C640,640 780,650 1000,700" fill="none" stroke="#fff" stroke-opacity="0.7" stroke-width="8" stroke-linecap="round"/>
  <path d="M260,540 C330,430 620,420 820,580 C640,570 420,600 260,540 Z" fill="#fff" fill-opacity="0.92"/>
  <circle cx="930" cy="540" r="16" fill="#fde047"/>
  <circle cx="690" cy="649" r="16" fill="#fde047"/>
  <text x="1040" y="400" fill="#fde047" font-size="34" font-weight="700" text-anchor="end">Over the top: arrives first</text>
  <text x="640" y="760" fill="#fde047" font-size="34" font-weight="700" text-anchor="middle">Underneath: still behind</text>
  <line x1="540" y1="360" x2="540" y2="250" stroke="#fff" stroke-width="10" stroke-linecap="round"/>
  <path d="M510,282 L540,246 L570,282" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="575" y="305" fill="#fff" font-size="40" font-weight="800">Lift</text>
  <line x1="900" y1="565" x2="900" y2="650" stroke="#fff" stroke-width="10" stroke-linecap="round"/>
  <path d="M872,620 L900,655 L928,620" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="540" y="880" fill="#fff" font-size="34" font-weight="700" text-anchor="middle">The top parcel arrives first, far ahead of the one below.</text>
  <text x="540" y="930" fill="#fff" font-size="34" font-weight="700" text-anchor="middle">The wing turns the air downward, so the air pushes it up.</text>
  <text x="540" y="1010" fill="#fff" fill-opacity="0.75" font-size="30" text-anchor="middle">Lower pressure above, higher below: the same lift, seen as pressure</text>
</svg>
