<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#fff"/>
    </marker>
  </defs>
  <text x="540" y="90" fill="#fff" font-size="56" font-weight="800" text-anchor="middle">Colour from a thin film</text>
  <text x="540" y="160" fill="#fff" fill-opacity="0.85" font-size="34" text-anchor="middle">The two reflections overlap and interfere</text>
  <rect x="120" y="480" width="840" height="130" fill="#fff" fill-opacity="0.18" stroke="#fff" stroke-width="6"/>
  <text x="150" y="450" fill="#fff" font-size="34" text-anchor="start">air</text>
  <text x="940" y="555" fill="#fff" font-size="34" font-weight="700" text-anchor="end">soap film</text>
  <text x="150" y="680" fill="#fff" font-size="34" text-anchor="start">air</text>
  <g stroke="#fff" stroke-width="8" stroke-linecap="round" fill="none">
    <line x1="240" y1="240" x2="430" y2="480" marker-end="url(#arrow)"/>
    <line x1="430" y1="480" x2="620" y2="240" marker-end="url(#arrow)"/>
    <line x1="430" y1="480" x2="520" y2="610"/>
    <line x1="520" y1="610" x2="610" y2="480"/>
    <line x1="610" y1="480" x2="800" y2="240" marker-end="url(#arrow)"/>
  </g>
  <line x1="985" y1="482" x2="985" y2="608" stroke="#fff" stroke-width="5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="985" y="660" fill="#fff" font-size="34" text-anchor="middle">thickness</text>
  <text x="200" y="215" fill="#fff" font-size="34" font-weight="700" text-anchor="start">incoming light</text>
  <text x="640" y="215" fill="#fff" font-size="34" font-weight="700" text-anchor="start">front reflection</text>
  <text x="790" y="300" fill="#fff" font-size="34" font-weight="700" text-anchor="start">back reflection</text>
  <text x="540" y="770" fill="#fff" font-size="34" text-anchor="middle">In step: that colour shines bright.</text>
  <text x="540" y="820" fill="#fff" font-size="34" text-anchor="middle">Out of step: that colour vanishes.</text>
  <text x="540" y="910" fill="#fff" font-size="34" text-anchor="middle">The front reflection flips by half a wave,</text>
  <text x="540" y="960" fill="#fff" font-size="34" text-anchor="middle">so a very thin film looks black.</text>
</svg>
