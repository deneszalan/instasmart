<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" font-family="system-ui, sans-serif">
  <text x="540" y="90" fill="#fff" font-size="56" font-weight="800" text-anchor="middle">The Sun–Jupiter balance point</text>
  <circle cx="400" cy="560" r="250" fill="#fff" fill-opacity="0.9"/>
  <text x="400" y="420" fill="#1e1b4b" font-size="44" font-weight="800" text-anchor="middle">Sun</text>
  <line x1="412" y1="560" x2="652" y2="560" stroke="#1e1b4b" stroke-width="5" stroke-dasharray="12 10"/>
  <circle cx="400" cy="560" r="10" fill="#1e1b4b"/>
  <text x="400" y="620" fill="#1e1b4b" font-size="34" font-weight="700" text-anchor="middle">Sun’s centre</text>
  <circle cx="667" cy="560" r="14" fill="#fff" stroke="#1e1b4b" stroke-width="4"/>
  <text x="700" y="520" fill="#fff" font-size="38" font-weight="800" text-anchor="start">balance point</text>
  <text x="700" y="568" fill="#fff" font-size="34" text-anchor="start">1.068 Sun radii</text>
  <text x="700" y="608" fill="#fff" font-size="34" text-anchor="start">from the centre</text>
  <circle cx="960" cy="840" r="34" fill="#fff" fill-opacity="0.35" stroke="#fff" stroke-width="6"/>
  <text x="960" y="920" fill="#fff" font-size="34" font-weight="700" text-anchor="middle">Jupiter</text>
  <text x="960" y="960" fill="#fff" fill-opacity="0.85" font-size="34" text-anchor="middle">(not to scale)</text>
  <text x="400" y="960" fill="#fff" font-size="34" text-anchor="middle">The Sun’s centre circles this point</text>
  <text x="400" y="1005" fill="#fff" font-size="34" text-anchor="middle">once every 11.86 years.</text>
</svg>
