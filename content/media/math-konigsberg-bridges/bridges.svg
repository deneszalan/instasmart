<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" font-family="system-ui, sans-serif">
  <text x="540" y="100" fill="#fff" font-size="56" font-weight="800" text-anchor="middle">Königsberg’s seven bridges</text>
  <rect x="0" y="330" width="1080" height="420" fill="#fff" fill-opacity="0.14"/>
  <text x="540" y="260" fill="#fff" font-size="40" font-weight="700" text-anchor="middle">North bank · 3 bridges</text>
  <text x="540" y="840" fill="#fff" font-size="40" font-weight="700" text-anchor="middle">South bank · 3 bridges</text>
  <ellipse cx="380" cy="540" rx="150" ry="95" fill="#fff" fill-opacity="0.35" stroke="#fff" stroke-width="6"/>
  <ellipse cx="790" cy="540" rx="170" ry="95" fill="#fff" fill-opacity="0.35" stroke="#fff" stroke-width="6"/>
  <g stroke="#fde047" stroke-width="16" stroke-linecap="round">
    <line x1="320" y1="445" x2="320" y2="330"/>
    <line x1="440" y1="445" x2="440" y2="330"/>
    <line x1="320" y1="635" x2="320" y2="750"/>
    <line x1="440" y1="635" x2="440" y2="750"/>
    <line x1="530" y1="540" x2="620" y2="540"/>
    <line x1="790" y1="445" x2="790" y2="330"/>
    <line x1="790" y1="635" x2="790" y2="750"/>
  </g>
  <text x="380" y="554" fill="#fff" font-size="40" font-weight="800" text-anchor="middle">Kneiphof · 5</text>
  <text x="790" y="554" fill="#fff" font-size="40" font-weight="800" text-anchor="middle">Lomse · 3</text>
  <text x="540" y="960" fill="#fff" fill-opacity="0.85" font-size="36" text-anchor="middle">Every landmass has an odd number of bridges,</text>
  <text x="540" y="1010" fill="#fff" fill-opacity="0.85" font-size="36" text-anchor="middle">so no walk can cross each one exactly once</text>
</svg>
