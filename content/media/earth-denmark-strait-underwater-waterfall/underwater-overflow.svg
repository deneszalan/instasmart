<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" role="img" aria-labelledby="title desc">
  <title id="title">A waterfall beneath the ocean</title>
  <desc id="desc">Cold, dense water crosses an undersea ridge and flows down into deeper water beneath a warmer layer. Schematic, not to scale.</desc>
  <rect x="30" y="30" width="1020" height="1020" rx="48" fill="#08263d"/>
  <g font-family="system-ui, sans-serif" fill="#ffffff">
    <text x="85" y="120" font-size="60" font-weight="700">A waterfall underwater</text>
    <path d="M80 260 Q140 240 200 260 T320 260 T440 260 T560 260 T680 260 T800 260 T920 260 T1000 260" fill="none" stroke="#c4edf7" stroke-width="8"/>
    <text x="85" y="220" font-size="48" fill="#c4edf7">Ocean surface</text>
    <text x="650" y="380" font-size="50" fill="#fddcab">Warmer water</text>
    <text x="85" y="475" font-size="50" fill="#91f3f8">Cold, dense</text>
    <text x="85" y="535" font-size="50" fill="#91f3f8">water</text>
    <path d="M80 675 L385 675 Q455 675 505 750 L615 905 L1000 905 L1000 970 L80 970 Z" fill="#466170"/>
    <path d="M80 675 L385 675 Q455 675 505 750 L615 905 L1000 905" fill="none" stroke="#c4d9e3" stroke-width="8"/>
    <path d="M130 610 L365 610 Q475 610 550 730 Q635 840 740 840 L910 840" fill="none" stroke="#91f3f8" stroke-width="24" stroke-linecap="round"/>
    <path d="M875 805 L925 840 L875 875" fill="none" stroke="#91f3f8" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="105" y="775" font-size="48">Undersea</text>
    <text x="105" y="835" font-size="48">ridge</text>
    <text x="680" y="655" font-size="48" fill="#91f3f8">Downhill</text>
    <text x="680" y="715" font-size="48" fill="#91f3f8">flow</text>
    <text x="540" y="1020" text-anchor="middle" font-size="44" fill="#c4d9e3">Schematic · not to scale</text>
  </g>
</svg>
