<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="kit.js"></script>
<script>
  // Loads a video's timeline, then its scene: ?video=<slug> loads <slug>/timeline.js and <slug>/scene.js.
  const dir = new URLSearchParams(location.search).get('video');
  const load = (src) => new Promise((ok, fail) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => fail(new Error(`could not load ${src}`)); document.body.appendChild(s); });
  load(`${dir}/timeline.js`).catch(() => {}).then(() => load(`${dir}/scene.js`));
</script>
</body>
</html>
